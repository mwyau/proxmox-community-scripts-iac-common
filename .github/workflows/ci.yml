name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: true
      - name: Install pinned Python and dependencies
        run: |
          uv python install
          uv sync --locked
      - name: Verify committed lockfile
        run: uv lock --check
      - name: Validate pure static analyzer and status
        run: |
          uv run --locked python -m compileall -q iac_common tests
          uv run --locked python -m unittest discover -s tests -v
      - name: Validate curated Kubernetes references CLI
        run: |
          uv run --locked python -m iac_common.kubernetes list
          uv run --locked python -m iac_common.kubernetes show lxc/immich >/dev/null

  upstream-preview:
    if: github.ref == 'refs/heads/feat/recipe-scanner-status'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.6"
          enable-cache: true
      - name: Install pinned Python and dependencies
        run: |
          uv python install
          uv sync --locked
      - name: Verify committed lockfile
        run: uv lock --check
      - name: Fetch upstream sources for full read-only scan
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 https://github.com/community-scripts/ProxmoxVE.git upstream-scripts
          git clone --quiet --depth 1 https://github.com/community-scripts/core.git upstream-core
          echo "SCRIPTS_SHA=$(git -C upstream-scripts rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CORE_SHA=$(git -C upstream-core rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Scan all recipes and generate status
        run: |
          set -euo pipefail
          uv run --locked python -m iac_common.scan --source upstream-scripts --core upstream-core --kind all --scripts-rev "$SCRIPTS_SHA" --core-rev "$CORE_SHA" --output out --strict-syntax
          uv run --locked python -m iac_common.status --scan out/compatibility.json --output out/recipes.json
          cat out/compatibility.md >> "$GITHUB_STEP_SUMMARY"
      - name: Check curated recipes against pinned source when revisions match
        run: |
          set -euo pipefail
          CATALOG_SHA="$(uv run --locked python -c 'from iac_common.kubernetes import load_catalog; print(load_catalog()["scripts_revision"])')"
          if [[ "$CATALOG_SHA" == "$SCRIPTS_SHA" ]]; then
            uv run --locked python -m iac_common.kubernetes validate --recipes out/recipes.json
          else
            echo "Curated alternatives reference $CATALOG_SHA; preview uses $SCRIPTS_SHA, so membership comparison is not applicable."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-recipe-preview
          path: out/
          retention-days: 30
          if-no-files-found: warn
