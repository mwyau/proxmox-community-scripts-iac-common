name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate pure static analyzer and status
        run: |
          python -m compileall -q iac_common tests
          python -m unittest discover -s tests -v

  upstream-preview:
    if: github.ref == 'refs/heads/feat/recipe-scanner-status'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch upstream sources for full read-only scan
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 https://github.com/community-scripts/ProxmoxVE.git upstream-scripts
          git clone --quiet --depth 1 https://github.com/community-scripts/core.git upstream-core
          echo "SCRIPTS_SHA=$(git -C upstream-scripts rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CORE_SHA=$(git -C upstream-core rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Scan all recipes and generate status
        run: |
          set -euo pipefail
          python -m iac_common.scan --source upstream-scripts --core upstream-core --kind all --scripts-rev "$SCRIPTS_SHA" --core-rev "$CORE_SHA" --output out --strict-syntax
          python -m iac_common.status --scan out/compatibility.json --output out/recipes.json
          cat out/compatibility.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-recipe-preview
          path: out/
          retention-days: 30
          if-no-files-found: warn
